<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situs Sedang Dalam Perbaikan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .neo-shadow {
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
        }
    </style>
</head>
<body class="bg-[#F4F4F1] min-h-screen flex items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-white border-4 border-black p-8 md:p-12 neo-shadow text-center">
        <div class="mb-8 inline-flex items-center justify-center w-20 h-20 bg-yellow-400 border-4 border-black rounded-full text-4xl">
            🏗️
        </div>

        <h1 class="text-4xl md:text-5xl font-bold mb-6 tracking-tight leading-tight">
            SISTEM SEDANG <br> <span class="text-blue-600">DITINGKATKAN</span>
        </h1>

        <p class="text-lg text-slate-700 mb-8 leading-relaxed max-w-md mx-auto">
            Kami sedang melakukan pemeliharaan rutin untuk memastikan pengalaman terbaik bagi Anda. Kami akan segera kembali dalam beberapa saat.
        </p>

        <div class="w-full bg-slate-200 border-2 border-black h-6 mb-8 overflow-hidden">
            <div class="bg-blue-500 h-full border-r-2 border-black" style="width: 75%"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
            <div class="border-2 border-black p-4 bg-green-100 italic">
                <span class="font-bold block not-italic">Status</span>
                Sedang Update Database
            </div>
            <div class="border-2 border-black p-4 bg-purple-100 italic">
                <span class="font-bold block not-italic">Estimasi Selesai</span>
                 2-3 Jam Lagi
            </div>
        </div>

        <div class="pt-6 border-t-2 border-black flex flex-col md:flex-row justify-between items-center gap-4 text-sm font-bold uppercase tracking-wider">
            <p>© 2026 Developer Team</p>
            <div class="flex gap-4">
                <a href="#" class="hover:underline">Bantuan</a>
                <a href="#" class="hover:underline">Status Server</a>
            </div>
        </div>
    </div>

</body>
</html>
